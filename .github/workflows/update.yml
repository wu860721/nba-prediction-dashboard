name: Daily NBA standings snapshot (third-party verified)
on:
  schedule:
    - cron: '0 7 * * *'  # 15:00 in Taiwan; GitHub scheduling may be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-standings-data
  cancel-in-progress: false
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight HTML parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Fetch NBA standings, check publication date, teams and records
        run: python scripts/update_standings.py
      - name: Commit validated standings and historical snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "NBA standings snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
