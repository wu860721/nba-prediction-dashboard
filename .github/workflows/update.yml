name: Daily NBA official standings snapshot
on:
  schedule:
    # 07:00 UTC = 15:00 Asia/Taipei (GitHub may delay the run)
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-standings-data
  cancel-in-progress: false
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NBA official ranks and validate (abort on API failure)
        run: python scripts/update_standings.py
      - name: Commit validated data.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "NBA official standings: $(date -u +%Y-%m-%d)"
            git push
          fi
