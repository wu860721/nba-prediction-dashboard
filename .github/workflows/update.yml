
name: Daily NBA standings snapshot

on:
  schedule:
    # 07:00 UTC = 15:00 Taiwan
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, validate, and save standings
        run: python scripts/update_standings.py

      - name: Commit updated snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA rankings $(date -u +%Y-%m-%d)"
            git push
          fi
